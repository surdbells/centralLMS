
<app-top></app-top>
<main class="main">
  <div class="container-lg">
    <div class="row align-items-center mb-7">
      <div (click)="goBack()" role="button" class="col-auto">
        <div class="avatar text-center avatar-md rounded text-primary-emphasis">
          <i class="fs-5">
            <tui-icon icon="@tui.chevron-left" />
          </i>
        </div>
      </div>
      <div class="col">
        <h1 class="fs-4 mb-0">Certificates </h1>
      </div>
    </div>

    <!-- Page content -->
    <div class="row">
      <div class="col-12">
        <section *ngIf="!ui_controls.is_loading" class="card py-5 mb-5">
          <div class="empty-state animate__animated animate__fadeInUp">
            <tui-icon class="fs-1 mb-3" icon="@tui.folder-tree" [style.color]="'var(--text)'"/>
            <h4>No Certificates Earned Yet 🏅</h4>
            <p>
              You haven’t earned any certificates yet. Complete your courses to unlock
              official recognition of your learning achievements.
            </p>
            <button (click)="to_dashboard()" class="btn btn-secondary abayti_primary_background text-black btn-note mt-2">
              <i class="bi bi-mortarboard me-2"></i> Complete Courses
            </button>
          </div>
        </section>
        <tui-loader *ngIf="ui_controls.is_loading" />
      </div>
    </div>
  </div>
</main>
