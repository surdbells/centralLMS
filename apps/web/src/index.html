<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    Every bundle Angular injects below is referenced relatively, so without
    this any route deeper than the root asked the server for
    /admin/users/main.js, got index.html back, and rendered nothing. Every
    deep link and every refresh away from / was a blank page.
  -->
  <base href="/" />
  <title>Central LMS / LXP</title>
  <link rel="shortcut icon" href="https://centrallms.com/v2/globals/assets/img/central-favicon.png" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
  <!-- libs.bundle.css + theme.bundle.css are bundled via angular.json "styles";
       no manual <link> needed (an absolute /assets link also breaks the build's
       stylesheet resolution). -->
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KKSQN8VHTX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KKSQN8VHTX');
</script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
