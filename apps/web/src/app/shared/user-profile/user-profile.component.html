<app-top></app-top>
<main class="main">
  <div class="ui-page">
    <header class="ui-page-header">
      <button type="button" class="ui-page-header__back" (click)="goBack()" [attr.aria-label]="'common.back' | translate">
        <i class="bi bi-chevron-left"></i>
      </button>
      <div class="ui-page-header__icon" aria-hidden="true"><i class="bi bi-person"></i></div>
      <div class="ui-page-header__titles">
        <h1>{{ 'profile.title' | translate }}</h1>
        <p>{{ 'profile.update_subtitle' | translate }}</p>
      </div>
    </header>

    <div class="profile-col">
      <section *ngIf="!ui_controls.is_loading" class="ui-section" id="password">
        <div class="ui-section__head">
          <div>
            <h2 class="ui-section__title">{{ 'profile.update_title' | translate }}</h2>
            <p class="ui-section__subtitle">{{ 'profile.update_subtitle' | translate }}</p>
          </div>
        </div>

        <form class="profile-avatar-row">
          <img id="profilePreview" src="{{user_single.avatar}}" alt="{{ 'profile.picture_preview' | translate }}" class="profile-avatar" />
          <div class="flex-grow-1">
            <label for="profileUpload" class="form-label">{{ 'profile.picture' | translate }}</label>
            <input [(ngModel)]="user_single.avatar" name="avatar" (change)="select_avatar($event)" class="form-control" type="file" id="profileUpload" accept="image/*" />
          </div>
        </form>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">{{ 'profile.first_name' | translate }}</label>
            <input [disabled]="true" type="text" [(ngModel)]="user_single.first_name" name="first_name" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ 'profile.last_name' | translate }}</label>
            <input [disabled]="true" type="text" [(ngModel)]="user_single.last_name" name="last_name" class="form-control">
          </div>
          <div class="col-12">
            <label class="form-label">{{ 'profile.email' | translate }}</label>
            <input [disabled]="true" [(ngModel)]="user_single.email" type="text" name="email" class="form-control">
            <div class="form-text">
              {{ 'profile.email_note' | translate }}
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ 'profile.phone' | translate }}</label>
            <input [(ngModel)]="user_single.phone" type="text" name="phone" class="form-control">
          </div>
        </div>

        <div class="profile-footer">
          <button (click)="update_changes()" class="btn btn-primary" type="button">{{ 'common.save_changes' | translate }}</button>
        </div>
      </section>
      <tui-loader *ngIf="ui_controls.is_loading" />
    </div>
  </div>
</main>
