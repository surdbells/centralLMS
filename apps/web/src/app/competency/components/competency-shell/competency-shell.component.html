<app-admintop></app-admintop>
<main class="main px-lg-6">
  <div class="container-fluid">
    <!-- Header -->
    <div class="d-flex align-items-start gap-3 mb-4 mt-3">
      <div (click)="goBack()" role="button" class="page-back">
        <tui-icon icon="@tui.chevron-left"></tui-icon>
      </div>
      <div>
        <h1 class="h4 fw-bold mb-1 d-flex align-items-center gap-2">
          <tui-icon icon="@tui.target" class="text-primary"></tui-icon>
          Competency Assurance
        </h1>
        <p class="text-muted small mb-0">
          What each job needs, measured against what its people can do.
        </p>
      </div>
    </div>

    <!-- Sub-navigation -->
    <ul class="nav nav-pills competency-nav mb-4">
      <li class="nav-item">
        <a class="nav-link" routerLink="/admin/competency" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          <tui-icon icon="@tui.chart-pie"></tui-icon> Overview
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/admin/competency/dictionary" routerLinkActive="active">
          <tui-icon icon="@tui.book-open"></tui-icon> Dictionary
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/admin/competency/profiles" routerLinkActive="active">
          <tui-icon icon="@tui.briefcase"></tui-icon> Job Profiles
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/admin/competency/assessments" routerLinkActive="active">
          <tui-icon icon="@tui.clipboard-check"></tui-icon> Assessments
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/admin/competency/reports" routerLinkActive="active">
          <tui-icon icon="@tui.file-text"></tui-icon> Reports
        </a>
      </li>
      @if (canManageCycles()) {
        <li class="nav-item">
          <a class="nav-link" routerLink="/admin/competency/cycles" routerLinkActive="active">
            <tui-icon icon="@tui.calendar"></tui-icon> Cycles
          </a>
        </li>
      }
    </ul>

    <router-outlet></router-outlet>
  </div>
</main>
