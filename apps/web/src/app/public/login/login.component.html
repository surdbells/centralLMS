<style>
  /* keep the image filling its card without distortion */
  .object-fit-cover { object-fit: cover; }
</style>

<div style="max-width: 50rem; padding-top: 5%" class="container animate__animated animate__fadeIn">
  <span class="badge abayti_secondary_background rounded-pill mb-3">
    <a [href]="publicSiteUrl" class="btn px-1 py-0 btn-sm text-white">{{ 'auth.back_to_website' | translate }}</a>
  </span>
  <div  class="row justify-content-center align-items-stretch g-4">
    <div class="col-12">

    </div>
    <div class="col-12 col-lg-6 d-none d-md-flex">
      <div class="card shadow-lg w-100 h-100 overflow-hidden">
        <img [src]="loginBackgroundUrl || '/assets/img/learner.jpg'" alt="Central LMS login page interface" class="w-100 h-100 object-fit-cover animate__animated animate__fadeIn"
        />
      </div>
    </div>
    <div class="col-12 col-lg-6 d-flex">
      <div class="card shadow-lg w-100 h-100">
        <div class="card-header text-center">
          <div class="row align-items-center">
            <div class="col-6 text-start">
              <img class="img-fluid" style="max-width: 140px; max-height: 56px; object-fit: contain"
                   [src]="logoUrl || 'assets/img/logo.png'"
                   [alt]="(orgName || 'Central LMS') + ' login portal'" />
            </div>
            <div class="col-6 text-end">
              <app-language-switcher></app-language-switcher>
            </div>
          </div>
        </div>
        <div class="card-body d-flex flex-column justify-content-center">
          <h1 class="fs-2 fw-bold mb-1">{{ 'login.welcome_back' | translate }}</h1>
          <p class="text-body-secondary mb-4">{{ 'login.subtitle' | translate }}</p>
          <form (ngSubmit)="user_login()" method="post">
            <div class="mb-3">
              <label for="email" class="form-label">{{ 'email' | translate }}</label>
              <input
                [(ngModel)]="login.email"
                name="email"
                id="email"
                type="email"
                autocomplete="username"
                class="form-control"
                placeholder="{{ 'email' | translate }}" />
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label mb-0">{{ 'password' | translate }}</label>
                <a routerLink="/reset" class="small text-decoration-none abayti_secondary_color">{{ 'login.forgot_password' | translate }}</a>
              </div>
              <div class="input-group">
                <input
                  [type]="fieldTextType ? 'text' : 'password'"
                  class="form-control"
                  name="password"
                  id="password"
                  autocomplete="current-password"
                  [(ngModel)]="login.password"
                  placeholder="{{ 'password' | translate }}" />
                <button (click)="toggleFieldTextType()" class="btn btn-outline-secondary" type="button"
                        [attr.aria-label]="'password' | translate">
                  <span *ngIf="fieldTextType" class="material-symbols-outlined">visibility</span>
                  <span *ngIf="!fieldTextType" class="material-symbols-outlined">visibility_off</span>
                </button>
              </div>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe" [(ngModel)]="rememberMe" />
              <label class="form-check-label" for="rememberMe">{{ 'login.keep_signed_in' | translate }}</label>
            </div>
            <tui-loader *ngIf="loading"></tui-loader>
            <button *ngIf="!loading" class="btn text-white fw-bold abayti_secondary_background btn-secondary w-100" type="submit">
              {{ 'login.cta' | translate }}
            </button>
          </form>

          <!-- Directory sign-in only when the organisation has actually connected one. -->
          <div class="social-login-section mt-4" *ngIf="ssoProviders.length > 0">
            <div class="text-center text-body-secondary small mb-2">{{ 'login.or_continue_with' | translate }}</div>
            <div class="d-grid gap-2">
              <button *ngFor="let p of ssoProviders"
                      class="btn btn-outline-secondary social-login-btn" type="button"
                      [disabled]="loading" (click)="signInWith(p.provider)">
                <span class="fw-semibold">{{ 'login.sign_in_with' | translate }} {{ p.label }}</span>
              </button>
            </div>
          </div>

          <p class="text-center text-body-secondary mb-0 mt-4">
            {{ 'login.no_account' | translate }}
            <a class="fw-semibold text-decoration-none abayti_secondary_color" routerLink="/register">{{ 'login.sign_up' | translate }}</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
