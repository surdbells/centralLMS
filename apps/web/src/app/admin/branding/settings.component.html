<main class="main">

    <header class="ui-page-header">
      <button type="button" class="ui-page-header__back" (click)="goBack()" [attr.aria-label]="'common.back' | translate">
        <i class="bi bi-chevron-left"></i>
      </button>
      <div class="ui-page-header__icon" aria-hidden="true"><i class="bi bi-sliders"></i></div>
      <div class="ui-page-header__titles">
        <h1>{{ 'branding.title' | translate }}</h1>
        <p>{{ 'branding.subtitle' | translate }}</p>
      </div>
    </header>

    <app-tenant-settings></app-tenant-settings>
  </div>
</main>
